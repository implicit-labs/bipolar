<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List - Guillermo's Approach</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #888;
      font-size: 0.875rem;
    }

    .content {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 24px;
    }

    .task-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      color: #fff;
      font-size: 1rem;
      transition: border-color 0.2s, transform 0.1s;
    }

    input:focus {
      outline: none;
      border-color: #0070f3;
    }

    button {
      background: #0070f3;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #0060df;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #333;
      cursor: not-allowed;
    }

    .task-list {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: #000;
      border: 1px solid #222;
      border-radius: 8px;
      margin-bottom: 8px;
      transition: border-color 0.2s, opacity 0.2s;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .task-item:hover {
      border-color: #333;
    }

    .task-item.completed {
      opacity: 0.6;
    }

    .task-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      font-size: 1rem;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #666;
    }

    .task-delete {
      background: transparent;
      color: #666;
      padding: 8px 12px;
      font-size: 0.875rem;
      transition: color 0.2s;
    }

    .task-delete:hover {
      color: #f00;
      background: transparent;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      color: #666;
      font-size: 0.875rem;
    }

    .footer p {
      margin-bottom: 8px;
    }

    .tech-stack {
      color: #444;
      font-size: 0.75rem;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #0070f3;
    }

    .back-link::before {
      content: "← ";
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    /* Optimistic UI feedback */
    .task-item.pending {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <main class="container">
    <a href="../../index.html" class="back-link">Back to Personas</a>

    <header class="header">
      <h1>Task List</h1>
      <p class="subtitle">
        Guillermo's Approach: Ship fast, iterate based on feedback
      </p>
    </header>

    <section class="content">
      <form class="task-form" id="taskForm">
        <input
          type="text"
          id="taskInput"
          placeholder="What needs to be done?"
          required
          autocomplete="off"
        />
        <button type="submit" id="submitBtn">Add</button>
      </form>

      <ul class="task-list" id="taskList">
        <!-- Tasks will be inserted here -->
      </ul>
    </section>

    <footer class="footer">
      <p>Ship to learn: Start simple, deploy fast, iterate based on feedback.</p>
      <p class="tech-stack">Demo - Client-side only with localStorage</p>
    </footer>
  </main>

  <script>
    // Task state
    let tasks = JSON.parse(localStorage.getItem('tasks-guillermo') || '[]')

    // DOM elements
    const form = document.getElementById('taskForm')
    const input = document.getElementById('taskInput')
    const submitBtn = document.getElementById('submitBtn')
    const taskList = document.getElementById('taskList')

    // Render tasks
    function renderTasks() {
      if (tasks.length === 0) {
        taskList.innerHTML = '<li class="empty-state">No tasks yet. Add one above to get started.</li>'
        return
      }

      taskList.innerHTML = tasks.map(task => `
        <li class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
          <input
            type="checkbox"
            class="task-checkbox"
            ${task.completed ? 'checked' : ''}
            onchange="toggleTask(${task.id})"
          />
          <span class="task-text">${escapeHtml(task.text)}</span>
          <button class="task-delete" onclick="deleteTask(${task.id})">Delete</button>
        </li>
      `).join('')
    }

    // Add task (with optimistic UI)
    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const text = input.value.trim()
      if (!text) return

      // Optimistic update
      const tempId = Date.now()
      const newTask = { id: tempId, text, completed: false }
      tasks.unshift(newTask)
      input.value = ''
      renderTasks()
      saveTasks()

      // Simulate network delay for realism
      await new Promise(resolve => setTimeout(resolve, 100))
    })

    // Toggle task completion
    window.toggleTask = function(id) {
      const task = tasks.find(t => t.id === id)
      if (task) {
        task.completed = !task.completed
        renderTasks()
        saveTasks()
      }
    }

    // Delete task
    window.deleteTask = function(id) {
      tasks = tasks.filter(t => t.id !== id)
      renderTasks()
      saveTasks()
    }

    // Save to localStorage
    function saveTasks() {
      localStorage.setItem('tasks-guillermo', JSON.stringify(tasks))
    }

    // Escape HTML to prevent XSS
    function escapeHtml(text) {
      const div = document.createElement('div')
      div.textContent = text
      return div.innerHTML
    }

    // Initial render
    renderTasks()

    // Focus input on load
    input.focus()
  </script>
</body>
</html>
