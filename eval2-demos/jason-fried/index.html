<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Jason Fried's Approach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0066cc;
            text-decoration: none;
            font-size: 16px;
        }

        .back-link:hover {
            color: #004499;
        }

        .back-link::before {
            content: "← ";
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 18px;
            line-height: 1.6;
            color: #1a1a1a;
            background: #f9f9f9;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #000;
        }

        #add-form {
            margin-bottom: 32px;
        }

        #task-input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
            background: #fff;
        }

        #task-input:focus {
            outline: none;
            border-color: #000;
        }

        #task-input::placeholder {
            color: #999;
        }

        #task-list {
            list-style: none;
        }

        .task {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .task.completed .task-text {
            color: #999;
            text-decoration: line-through;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-text {
            flex-grow: 1;
            word-break: break-word;
        }

        .task-delete {
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 20px;
            padding: 0 4px;
            flex-shrink: 0;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .task-delete:hover {
            opacity: 1;
            color: #666;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 48px 20px;
            font-size: 16px;
        }

        @media (max-width: 640px) {
            body {
                padding: 16px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 20px;
            }

            #task-input {
                font-size: 16px;
            }

            .task {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <a href="../../index.html" class="back-link">Back to Personas</a>
    <h1>Tasks</h1>

    <form id="add-form">
        <input
            type="text"
            id="task-input"
            placeholder="Add a task..."
            autocomplete="off"
            autofocus
        >
    </form>

    <ul id="task-list"></ul>
    <div id="empty-state" class="empty-state" style="display: none;">
        No tasks yet
    </div>

    <script>
        // State
        let tasks = [];

        // Load from localStorage
        function loadTasks() {
            const saved = localStorage.getItem('tasks');
            tasks = saved ? JSON.parse(saved) : [];
            render();
        }

        // Save to localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Add task
        function addTask(text) {
            if (!text.trim()) return;

            tasks.push({
                id: Date.now(),
                text: text.trim(),
                completed: false
            });

            saveTasks();
            render();
        }

        // Toggle task completion
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                render();
            }
        }

        // Delete task
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
        }

        // Render tasks
        function render() {
            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');

            if (tasks.length === 0) {
                taskList.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            taskList.style.display = 'block';
            emptyState.style.display = 'none';

            taskList.innerHTML = tasks.map(task => `
                <li class="task ${task.completed ? 'completed' : ''}">
                    <input
                        type="checkbox"
                        class="task-checkbox"
                        ${task.completed ? 'checked' : ''}
                        onchange="toggleTask(${task.id})"
                    >
                    <span class="task-text">${escapeHtml(task.text)}</span>
                    <button class="task-delete" onclick="deleteTask(${task.id})">&times;</button>
                </li>
            `).join('');
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Form submit handler
        document.getElementById('add-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('task-input');
            addTask(input.value);
            input.value = '';
            input.focus();
        });

        // Initialize
        loadTasks();
    </script>
</body>
</html>
